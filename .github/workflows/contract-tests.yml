name: API contract tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract-tests:
    name: contract tests (${{ matrix.variant }} message)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # let both variants run, so both failures are visible on the PR
      matrix:
        variant: [unhelpful, helpful]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh
          postman --version

      - name: Start the API
        run: |
          node src/server.js &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 0.5
          done
          echo "API did not start" && exit 1

      # Behavioral gate: the saved assertions must pass. The nonzero exit code
      # is preserved so a failing assertion fails the job.
      - name: Run the Postman collection
        run: >
          postman collection run
          collections/orders-${{ matrix.variant }}.postman_collection.json
          --env-var baseUrl=http://localhost:3000
