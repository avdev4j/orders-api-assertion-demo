openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Get an order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
components:
  schemas:
    Order:
      type: object
      additionalProperties: false
      required: [orderId, customerId, status, total, currency]
      properties:
        orderId:
          type: string
        customerId:
          type: string
        status:
          type: string
          enum: [pending, paid, shipped, cancelled]
        total:
          type: number
        currency:
          type: string
